<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk · Lintas Benteng Projection</title>
  <meta name="description" content="Masuk sesuai peran untuk melihat menu dan dashboard yang cocok.">
  <meta name="theme-color" content="#0a62ad">
  <link rel="icon" href="assets/ikon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/ikon-192.png">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main class="utama">
  <div class="masuk-wadah">
    <section class="masuk-kartu" aria-labelledby="judul-masuk">
      <div class="masuk-logo"><img src="assets/logo-bps.png" alt="" width="46" height="36"><div><b>Lintas Benteng Projection</b><span>BPS Kabupaten Bengkulu Tengah</span></div></div>
      <div id="isi-masuk"></div>
    </section>
  </div>
</main>

<script type="module">
import { pasangKerangka, esc } from "./assets/app.js";
import { ikon } from "./assets/dashboard.js";
import { PERAN, SEMUA_HALAMAN, bolehAkses, masuk, keluar, sesi, simpanSesiFirebase } from "./assets/akses.js";

if (new URLSearchParams(location.search).get("keluar")) {
  await keluar();
  location.replace("index.html");
  await new Promise(() => {}); // berhenti di sini sampai halaman berpindah
}
const meta = await pasangKerangka("masuk.html");
const isi = document.getElementById("isi-masuk");
const SANDI_CONTOH = "lintas2026";

function tujuan(peran, izin) {
  const l = new URLSearchParams(location.search).get("lanjut");
  return l && SEMUA_HALAMAN.includes(l) && bolehAkses(peran, l, izin) ? l : "index.html";
}

function tampilkanSudahMasuk(s) {
  isi.innerHTML = `<h1 id="judul-masuk">Halo, ${esc(s.nama)}</h1>
    <p>Anda masuk sebagai ${esc(PERAN[s.peran].nama)}.</p>
    <a class="tombol utama-aksi lebar" href="${tujuan(s.peran, s.halaman)}">Lanjut ke ${esc(PERAN[s.peran].judulBeranda)}</a>
    <button class="tombol lebar" type="button" id="btn-keluar" style="margin-top:10px">Ganti akun</button>`;
  document.getElementById("btn-keluar").addEventListener("click", async () => { await keluar(); location.reload(); });
}

/* ---------- masuk dengan Google (Firebase) */
const LOGO_GOOGLE = `<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>`;
const PESAN_STATUS = {
  ditolak: ["peringatan", "Pendaftaran akun ini tidak disetujui. Hubungi admin bila menurut Anda ini keliru."],
  nonaktif: ["peringatan", "Akun ini sedang dinonaktifkan admin."],
  hilang: ["peringatan", "Akun ini sudah dihapus admin. Masuk lagi untuk mendaftar ulang."],
  menunggu: ["info", "Akun Anda masih menunggu persetujuan admin."],
};

async function lanjutkanAkun(fk, user) {
  isi.innerHTML = `<h1 id="judul-masuk">Masuk</h1><p>Memeriksa akun…</p>`;
  const akun = await fk.pastikanAkun(user);
  if (akun.status === "aktif" && PERAN[akun.peran]) {
    const s = fk.sesiDariAkun(akun);
    simpanSesiFirebase(s);
    location.href = tujuan(s.peran, s.halaman);
    return;
  }
  tampilkanStatusAkun(fk, akun);
}

function tampilkanStatusAkun(fk, akun) {
  const menunggu = akun.status === "menunggu";
  isi.innerHTML = `<div class="status-akun ${menunggu ? "menunggu" : "ditolak"}">
      <span class="kpi-lingkar ${menunggu ? "oranye" : "merah"}">${ikon(menunggu ? "jam" : "peringatan", 26)}</span>
      <h1 id="judul-masuk">${menunggu ? "Menunggu persetujuan" : akun.status === "nonaktif" ? "Akun dinonaktifkan" : "Pendaftaran tidak disetujui"}</h1>
      <p>${menunggu
        ? "Akun Anda sudah terdaftar. Admin perlu menyetujui dan memberi peran sebelum Anda bisa masuk. Halaman ini akan lanjut sendiri begitu disetujui."
        : esc(PESAN_STATUS[akun.status]?.[1] || "Akun ini belum bisa dipakai.")}</p>
      <div class="akun-google">${akun.foto ? `<img src="${esc(akun.foto)}" alt="" width="36" height="36" referrerpolicy="no-referrer">` : ikon("orang", 22)}
        <div><b>${esc(akun.nama || "")}</b><span>${esc(akun.email || "")}</span></div></div>
    </div>
    <button class="tombol lebar" type="button" id="btn-ganti" style="margin-top:14px">Masuk dengan akun lain</button>
    <a class="tautan-tamu" href="index.html">Lanjut tanpa masuk (sebagai masyarakat)</a>`;
  document.getElementById("btn-ganti").addEventListener("click", async () => { await keluar(); await fk.keluarFirebase(); location.replace("masuk.html"); });
  if (menunggu) {
    fk.pantauAkunSendiri(akun.uid, (a) => {
      if (a && a.status === "aktif" && PERAN[a.peran]) {
        const s = fk.sesiDariAkun(a);
        simpanSesiFirebase(s);
        location.href = tujuan(s.peran, s.halaman);
      } else if (a && a.status !== "menunggu") tampilkanStatusAkun(fk, a);
    });
  }
}

async function tampilkanGoogle() {
  const status = new URLSearchParams(location.search).get("status");
  const pesan = PESAN_STATUS[status];
  isi.innerHTML = `<h1 id="judul-masuk">Masuk</h1>
    <p>Masuk dengan akun Google. Akun baru perlu disetujui admin sebelum bisa dipakai.</p>
    ${pesan ? `<div class="pesan ${pesan[0]}" role="status">${esc(pesan[1])}</div>` : ""}
    <button class="tombol tombol-google lebar" type="button" id="btn-google">${LOGO_GOOGLE}<span>Masuk dengan Google</span></button>
    <div class="masuk-galat" id="galat" role="alert" hidden></div>
    <a class="tautan-tamu" href="index.html">Lanjut tanpa masuk (sebagai masyarakat)</a>
    <p class="meta-kecil masuk-catatan">Yang disimpan hanya nama, email, dan foto profil Google Anda, untuk keperluan persetujuan akun.</p>`;
  const tombol = document.getElementById("btn-google");
  const galat = document.getElementById("galat");
  let fk;
  try {
    fk = await import("./assets/firebase-klien.js");
    const dariRedirect = await fk.hasilRedirect();
    if (dariRedirect) return lanjutkanAkun(fk, dariRedirect);
    const kini = !status && (await fk.penggunaKini());
    if (kini) return lanjutkanAkun(fk, kini);
  } catch (e) {
    galat.textContent = fk ? fk.pesanGalat(e) : "Firebase belum bisa dimuat. Periksa sambungan internet.";
    galat.hidden = false;
  }
  tombol.addEventListener("click", async () => {
    tombol.disabled = true; galat.hidden = true;
    try {
      fk ||= await import("./assets/firebase-klien.js");
      const user = await fk.masukGoogle();
      if (user) await lanjutkanAkun(fk, user);
    } catch (e) {
      galat.textContent = fk ? fk.pesanGalat(e) : "Firebase belum bisa dimuat.";
      galat.hidden = false;
      tombol.disabled = false;
      if (document.getElementById("judul-masuk")?.textContent !== "Masuk") tampilkanGoogle();
    }
  });
}

async function tampilkanForm() {
  if (meta?.login === "firebase") return tampilkanGoogle();
  const firebase = false;
  isi.innerHTML = `<h1 id="judul-masuk">Masuk</h1>
    <p>Pilih akun sesuai peran Anda.</p>
    <form id="form-masuk" novalidate>
      <div class="medan"><label for="pengguna">${firebase ? "Email" : "Nama pengguna"}</label>
        <input id="pengguna" name="pengguna" type="${firebase ? "email" : "text"}" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="medan"><label for="sandi">Kata sandi</label>
        <input id="sandi" name="sandi" type="password" autocomplete="current-password" required></div>
      <div class="masuk-galat" id="galat" role="alert" hidden></div>
      <button class="tombol utama-aksi lebar" type="submit" id="kirim">Masuk</button>
    </form>
    <a class="tautan-tamu" href="index.html">Lanjut tanpa masuk (sebagai masyarakat)</a>
    <div id="contoh"></div>`;
  const form = document.getElementById("form-masuk");
  const inputId = document.getElementById("pengguna");
  const inputSandi = document.getElementById("sandi");
  const galat = document.getElementById("galat");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const kirim = document.getElementById("kirim");
    kirim.disabled = true; kirim.textContent = "Memeriksa…"; galat.hidden = true;
    const hasil = await masuk(meta, inputId.value, inputSandi.value);
    if (hasil.ok) { location.href = tujuan(hasil.peran); return; }
    galat.textContent = hasil.galat; galat.hidden = false;
    kirim.disabled = false; kirim.textContent = "Masuk";
  });

  if (meta?.login === "contoh") {
    try {
      const { akun } = await (await fetch("data/pengguna.json", { cache: "no-cache" })).json();
      document.getElementById("contoh").innerHTML = `<div class="contoh-akun"><h2>Akun contoh</h2>
        <div class="chip-akun">${akun.map((a) => `<button type="button" data-id="${esc(a.id)}">${ikon(PERAN[a.peran].ikon, 16)}${esc(PERAN[a.peran].nama)}</button>`).join("")}</div>
        <span class="meta-kecil">Sandi semua akun contoh: <b>${SANDI_CONTOH}</b>. Untuk peragaan tampilan per peran; data tetap terbuka untuk umum.</span></div>`;
      document.querySelectorAll(".chip-akun button").forEach((b) => b.addEventListener("click", () => {
        inputId.value = b.dataset.id; inputSandi.value = SANDI_CONTOH; inputSandi.focus();
      }));
    } catch { /* daftar akun contoh tidak tersedia */ }
  }
}

const s = sesi();
if (s) tampilkanSudahMasuk(s); else await tampilkanForm();
</script>
</body>
</html>
