name: Antrean dari situs

# Penjaga antrean: satu job panjang yang memeriksa Firestore tiap menit pada jam kerja (Senin sampai Jumat, 07.00
# sampai 18.00 WIB) dan tiap 10 menit di luar itu. Begitu ada kiriman atau permintaan baru dari situs (harga, keputusan
# cek data, tindak lanjut, pengaturan, tombol "Jalankan" di panel Pengaturan), pipeline.yml langsung dijalankan.
# Menjelang batas waktu job (6 jam), penjaga menjalankan dirinya lagi, jadi selalu ada satu penjaga aktif.
# Jadwal di bawah hanya cadangan untuk menghidupkan penjaga bila rantainya putus (jadwal GitHub bisa tertunda lama).
# Repositori publik tidak dibatasi menit Actions, jadi gratis. Bila Firebase belum diatur, penjaga langsung selesai.
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      paksa:
        description: "Jalankan pipeline sekarang walaupun tidak ada kiriman baru"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

# Hanya satu penjaga berjalan. Pemicu baru menunggu (paling banyak satu) dan menjadi penjaga berikutnya.
concurrency:
  group: antrean-situs
  cancel-in-progress: false

jobs:
  jaga:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Jalankan pipeline sekarang (diminta)
        if: inputs.paksa
        run: gh workflow run pipeline.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-firebase.txt

      - name: Jaga antrean
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          pip install -q -r requirements-firebase.txt
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/akun-layanan.json"
          trap 'rm -f "$RUNNER_TEMP/akun-layanan.json"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/akun-layanan.json" python -m pipeline firestore-jaga --menit 340 --lanjutkan
