name: Pipeline & Dashboard

# Menjalankan pipeline (ambil data -> quality gate -> analisis -> publikasi) lalu menerbitkan dashboard ke GitHub Pages,
# dan juga ke Firebase Hosting bila Secret Firebase sudah diisi (lihat docs/FIREBASE.md).
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "config/**"
      - "pipeline/**"
      - "site/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/pipeline.yml"
      - "firebase.json"
      - "firestore.rules"
  schedule:
    # Hari kerja sekitar 11.47 dan 15.47 WIB (UTC+7), setelah pencatatan pagi/siang.
    - cron: "47 4 * * 1-5"
    - cron: "47 8 * * 1-5"
  workflow_dispatch:
    inputs:
      demo:
        description: "Mode demo (otomatis = demo hanya bila belum ada data harga nyata)"
        type: choice
        options: [otomatis, ya, tidak]
        default: otomatis

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pipeline-pages
  cancel-in-progress: false

jobs:
  bangun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Uji otomatis
        run: python -m pytest -q

      - name: Ambil data cuaca (konektor Big Data)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python -m pipeline ambil-cuaca

      - name: Simpan data konektor ke repositori (jejak audit)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/masuk/konteks
          if git diff --cached --quiet; then
            echo "Tidak ada data konektor baru."
          else
            git commit -m "data: perbarui cuaca Open-Meteo"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Ambil log uptime (cabang log-uptime)
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin log-uptime >/dev/null; then
            git fetch -q origin log-uptime
            git show origin/log-uptime:uptime.csv > data/uptime.csv
          else
            echo "Log uptime belum ada."
          fi

      - name: Jalankan pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE_DEMO: ${{ inputs.demo || 'otomatis' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_KE: ${{ secrets.EMAIL_KE }}
          EMAIL_DARI: ${{ secrets.EMAIL_DARI }}
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: python -m pipeline jalankan --keluaran site/data --demo "$MODE_DEMO"

      - name: Simpan status notifikasi (agar tidak terkirim dua kali)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d data/notifikasi ]; then echo "Belum ada notifikasi terkirim."; exit 0; fi
          git add data/notifikasi
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan status notifikasi."
          else
            git commit -m "notifikasi: catat sinyal/buletin terkirim"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Simpan hasil bangun untuk Firebase Hosting
        uses: actions/upload-artifact@v4
        with:
          name: situs
          path: site
          retention-days: 3

  terbitkan:
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Terbit ke Firebase Hosting (dan aturan Firestore bila diizinkan). Dilewati bila Secret Firebase belum diisi.
  terbitkan-firebase:
    needs: bangun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
      FIREBASE_HOSTING_SITE: ${{ secrets.FIREBASE_HOSTING_SITE }}
      FIREBASE_ADMIN_AWAL: ${{ secrets.FIREBASE_ADMIN_AWAL }}
      FIREBASE_TERBITKAN_ATURAN: ${{ secrets.FIREBASE_TERBITKAN_ATURAN }}
      FIREBASE_TOOLS: firebase-tools@14.27.0
    steps:
      - name: Periksa pengaturan Firebase
        id: cek
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_WEB_CONFIG" ] || [ -z "$FIREBASE_HOSTING_SITE" ]; then
            echo "::notice::Firebase belum diatur. Isi FIREBASE_WEB_CONFIG, FIREBASE_HOSTING_SITE, dan FIREBASE_SERVICE_ACCOUNT lewat panel Pengaturan. Situs tetap terbit ke GitHub Pages."
            echo "siap=tidak" >> "$GITHUB_OUTPUT"
          else
            echo "siap=ya" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cek.outputs.siap == 'ya'

      - uses: actions/download-artifact@v4
        if: steps.cek.outputs.siap == 'ya'
        with:
          name: situs
          path: site

      - uses: actions/setup-python@v5
        if: steps.cek.outputs.siap == 'ya'
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        if: steps.cek.outputs.siap == 'ya'
        with:
          node-version: "20"

      - name: Siapkan kredensial dan proyek
        if: steps.cek.outputs.siap == 'ya'
        run: |
          pip install -q -r requirements.txt
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/akun-layanan.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/akun-layanan.json" >> "$GITHUB_ENV"
          PROYEK=$(python -c "from pathlib import Path; from pipeline import firebase; print(firebase.konfigurasi_web(Path('.'))['projectId'])")
          echo "Proyek Firebase: $PROYEK, situs Hosting: $FIREBASE_HOSTING_SITE"
          echo "FIREBASE_PROYEK=$PROYEK" >> "$GITHUB_ENV"

      - name: Terbitkan ke Firebase Hosting
        if: steps.cek.outputs.siap == 'ya'
        run: |
          npx --yes "$FIREBASE_TOOLS" target:apply hosting lbp "$FIREBASE_HOSTING_SITE" --project "$FIREBASE_PROYEK"
          npx --yes "$FIREBASE_TOOLS" deploy --only hosting:lbp --project "$FIREBASE_PROYEK" --non-interactive --message "commit ${GITHUB_SHA::7}"

      - name: Terbitkan aturan Firestore
        if: steps.cek.outputs.siap == 'ya' && env.FIREBASE_TERBITKAN_ATURAN == 'ya'
        run: |
          python -m pipeline aturan-firebase --keluaran firestore.rules
          npx --yes "$FIREBASE_TOOLS" deploy --only firestore:rules --project "$FIREBASE_PROYEK" --non-interactive

      - name: Hapus kredensial
        if: always()
        run: rm -f "$RUNNER_TEMP/akun-layanan.json"
