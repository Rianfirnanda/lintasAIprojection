name: Penjajakan sumber data

# Mencari tahu sumber mana yang sungguh menyediakan harga tingkat kabupaten/kota (Bengkulu Tengah, Kepahiang, Kota Bengkulu).
# Hanya membaca; hasilnya apa adanya di data/sumber/hasil_probe.json. Dijalankan di GitHub Actions karena sandbox
# pengembangan tidak bisa membuka situs resmi.
on:
  workflow_dispatch:
    inputs:
      jenis:
        description: "dasar = penjajakan awal; lanjut = SP2KP, Tableau, Bapanas, data terbuka daerah, BPS, PIHPS 5 tahun; lanjut2/lanjut3 = tahap 2/3; sp2kp = riwayat harga harian SP2KP 5 tahun"
        default: "lanjut"

permissions:
  contents: write

concurrency:
  group: pipeline-pages
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Jajaki sumber
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
          JENIS: ${{ inputs.jenis }}
        run: |
          case "$JENIS" in
            dasar) python -m pipeline probe-sumber ;;
            lanjut2) python -m pipeline probe-lanjut --tahap 2 ;;
            lanjut3) python -m pipeline probe-lanjut --tahap 3 ;;
            sp2kp) python -m pipeline ambil-sp2kp --riwayat-hari 1830 && python -m pipeline sp2kp-ke-harga ;;
            *) python -m pipeline probe-lanjut ;;
          esac
      - name: Simpan hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sumber/
          if [ -d data/mentah ]; then git add data/mentah data/masuk/harga; fi
          if [ -f config/peta_varian_sp2kp.csv ]; then git add config/peta_varian_sp2kp.csv; fi
          if git diff --cached --quiet; then echo "Tidak ada perubahan."; exit 0; fi
          git commit -m "data: hasil penjajakan sumber harga kabupaten/kota"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
