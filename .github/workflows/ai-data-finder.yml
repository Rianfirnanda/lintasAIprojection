name: AI Data Finder

# Agen AI mencari KANDIDAT sumber data. Hasil wajib diverifikasi analis.
# Penyedia gratis (mode otomatis mencoba semuanya bergantian; yang kuncinya belum diisi dilewati):
#   - Gemini (utama, dengan pencarian Google): secret GEMINI_API_KEY (gratis dari Google AI Studio).
#   - Groq, Cerebras, OpenRouter, Mistral (tanpa pencarian web): secret GROQ_API_KEY, CEREBRAS_API_KEY,
#     OPENROUTER_API_KEY, MISTRAL_API_KEY. Semuanya punya kuota gratis.
#   - GitHub Models (cadangan terakhir, tanpa pencarian web): memakai GITHUB_TOKEN bawaan, tidak perlu secret.
# Pencarian web gratis: secret TAVILY_API_KEY (1.000 kredit per bulan); hasilnya diberikan ke AI mana pun.
# Opsional berbayar: Claude (secret ANTHROPIC_API_KEY, pilih penyedia "anthropic").
# Kunci yang diisi lewat situs (Firestore) juga dipakai di sini, menggantikan GitHub Secret yang sama.
on:
  workflow_dispatch:
    inputs:
      komoditas:
        description: "Komoditas/varian (mis. cabai rawit merah)"
        required: true
      periode:
        description: "Periode data (mis. Oktober 2026)"
        required: true
      kebutuhan:
        description: "Jenis data yang dicari"
        default: "harga eceran harian"
      wilayah:
        description: "Wilayah"
        default: "Kabupaten Bengkulu Tengah, Provinsi Bengkulu"
      penyedia:
        description: "Penyedia AI (otomatis = coba semua AI gratis bergantian sampai ada yang berhasil)"
        type: choice
        options: [otomatis, gemini, groq, cerebras, openrouter, mistral, github_models, anthropic]
        default: otomatis

permissions:
  contents: write
  actions: write
  models: read

concurrency:
  group: ai-data-finder
  cancel-in-progress: false

jobs:
  cari:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ai.txt

      # Kunci yang diisi lewat situs (Pengaturan -> AI) tersimpan di Firestore; mesin membacanya dengan akun layanan.
      - name: Sambungkan ke Firestore (kunci dari situs)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "Firebase belum diatur, hanya GitHub Secrets yang dipakai."; exit 0; fi
          pip install -q -r requirements-firebase.txt
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/akun-layanan.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/akun-layanan.json" >> "$GITHUB_ENV"

      - name: Cari kandidat sumber
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOMODITAS: ${{ inputs.komoditas }}
          PERIODE: ${{ inputs.periode }}
          KEBUTUHAN: ${{ inputs.kebutuhan }}
          WILAYAH: ${{ inputs.wilayah }}
          PENYEDIA: ${{ inputs.penyedia }}
        run: |
          python -m pipeline cari-sumber --komoditas "$KOMODITAS" --periode "$PERIODE" \
            --kebutuhan "$KEBUTUHAN" --wilayah "$WILAYAH" --penyedia "$PENYEDIA"

      - name: Simpan hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sumber/kandidat_ai.json
          git commit -m "sumber: kandidat AI Data Finder"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Perbarui dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pipeline.yml --ref "${GITHUB_REF_NAME}"

      - name: Hapus kredensial
        if: always()
        run: rm -f "$RUNNER_TEMP/akun-layanan.json"
