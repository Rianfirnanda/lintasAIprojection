name: Cek sumber (sementara)
on:
  pull_request:
    paths: ["scripts/cek_sumber.py", ".github/workflows/cek-sumber.yml"]
permissions:
  contents: read
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/cek_sumber.py
