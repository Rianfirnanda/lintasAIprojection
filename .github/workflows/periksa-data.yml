name: Periksa data & kode

# Dijalankan untuk pull request: memastikan berkas data baru terbaca dan kode lolos uji sebelum digabung ke main.
on:
  pull_request:
    paths:
      - "data/**"
      - "config/**"
      - "pipeline/**"
      - "site/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/**"
      - "firebase.json"
      - "firestore.rules"
      - "tests_firebase/**"
      - "package.json"

permissions:
  contents: read

jobs:
  periksa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Uji otomatis
        run: python -m pytest -q
      - name: Validasi berkas masukan
        run: python -m pipeline periksa
      - name: Uji pipeline lengkap (tanpa publikasi)
        run: python -m pipeline jalankan --keluaran site/data --tanpa-github

  # Aturan keamanan Firestore dan pengambil kiriman situs diuji di emulator Firebase (tanpa proyek atau kunci sungguhan).
  aturan-firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Pasang alat uji Firebase
        run: npm install --no-audit --no-fund
      - name: Uji aturan Firestore di emulator
        run: npm run uji:aturan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-firebase.txt
      - name: Uji mesin pengambil kiriman situs di emulator
        run: |
          pip install -q -r requirements-firebase.txt
          npm run uji:mesin
